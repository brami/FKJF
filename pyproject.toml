[project]
name = "fv-web"
version = "0.1.0"
description = "Webseite des Fördervereins der Kinder- und Jugendfeuerwehr Kreuzau"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "docs/LICENSE"]
authors = [{ name = "Michael Bramer" }]
# Abhängigkeiten mit festen Versionen: requirements.txt (Server) und
# requirements-dev.txt (Entwicklung, Tests). Das Projekt wird nicht als Paket installiert.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
