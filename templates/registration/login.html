{% extends "base.html" %}

{% block titel %}Anmelden – Förderverein KF/JF Kreuzau{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}

{% block inhalt %}
  <h1>Anmelden</h1>
  {% if form.errors %}
    <p class="fehler">Benutzername oder Passwort ist falsch.</p>
  {% endif %}
  <form method="post" class="formular">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Anmelden</button>
  </form>
{% endblock %}
